name: Build CDS 2016 data

on:
  push:
    paths:
      - "data/pyq/_generated/**"
      - ".github/workflows/build-cds-2016.yml"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode paper data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/pyq
          base64 -d data/pyq/_generated/cds-2016-I.js.gz.b64 | gzip -d > data/pyq/cds-2016-I.js
          base64 -d data/pyq/_generated/cds-2016-II.js.gz.b64 | gzip -d > data/pyq/cds-2016-II.js
          node --check data/pyq/cds-2016-I.js
          node --check data/pyq/cds-2016-II.js
      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pyq/cds-2016-I.js data/pyq/cds-2016-II.js
          git diff --cached --quiet || git commit -m "add CDS 2016 I and II English papers"
          git push
