name: Inspect CDS 2013 article blocks
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-cds-2013.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect question list markup
        run: |
          python -m pip install --quiet beautifulsoup4 requests
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          checks=[
            ("I","https://examvictor.com/cds-2013-english-question-paper-1/",["I should do the same","She told the children","I am not telling"]),
            ("II","https://examvictor.com/cds-2013-english-question-paper-2/",["Lack of winter rains","The young man was well dressed","The salesmen in the shop"]),
          ]
          for session,url,terms in checks:
            soup=BeautifulSoup(requests.get(url,headers={"User-Agent":"Mozilla/5.0"},timeout=30).text,"html.parser")
            root=soup.select_one(".entry-content")
            print("\nSESSION",session)
            for term in terms:
              el=next((x for x in root.find_all(["li","p"]) if term.lower() in x.get_text(" ",strip=True).lower()),None)
              print("\nTERM",term,"ELEMENT",el.name if el else None)
              if el:
                print("OUTER",str(el)[:5000])
                print("PARENT",str(el.parent)[:1500])
          PY