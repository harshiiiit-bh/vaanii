name: Inspect CDS 2013 source structure
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-cds-2013.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect source pages
        run: |
          python - <<'PY'
          import urllib.request
          from html.parser import HTMLParser
          import re
          urls = [
              "https://examvictor.com/cds-2013-english-question-paper-1/",
              "https://examvictor.com/cds-2013-english-question-paper-2/",
          ]
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.stack=[]; self.blocks=[]; self.current=[]; self.tag=""
              def handle_starttag(self,tag,attrs):
                  attrs=dict(attrs)
                  if tag in ("p","li","h1","h2","h3","h4"):
                      self.stack.append((tag,len(self.blocks)))
                      self.current=[]
              def handle_endtag(self,tag):
                  if self.stack and self.stack[-1][0]==tag:
                      t,_=self.stack.pop()
                      v=" ".join("".join(self.current).split())
                      if v: self.blocks.append((t,v))
              def handle_data(self,data):
                  if self.stack: self.current.append(data)
          for u in urls:
              req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"})
              raw=urllib.request.urlopen(req,timeout=30).read().decode("utf-8","replace")
              print("\nURL",u,"bytes",len(raw),"title",re.search(r"<title>(.*?)</title>",raw,re.S).group(1)[:200])
              for pat in ["entry-content","post-content","article-content"]:
                  print(pat, raw.find(pat))
              p=P(); p.feed(raw)
              print("BLOCK COUNT",len(p.blocks))
              for t,v in p.blocks[:65]:
                  print(t,repr(v[:260]))
          PY