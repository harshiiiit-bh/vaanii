name: Inspect CDS 2013 lists
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-cds-2013.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Show list structure
        run: |
          python -m pip install --quiet beautifulsoup4 requests
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          for s,u in [("I","https://examvictor.com/cds-2013-english-question-paper-1/"),("II","https://examvictor.com/cds-2013-english-question-paper-2/")]:
            root=BeautifulSoup(requests.get(u,headers={"User-Agent":"Mozilla/5.0"}).text,"html.parser").select_one(".entry-content")
            print("\nSESSION",s)
            for j,x in enumerate(root.find_all(["ol","ul"])):
              if x.find_parent(["ol","ul"]) is not None: continue
              items=x.find_all("li",recursive=False)
              print("LIST",j,x.name,"start",x.get("start"),"count",len(items))
              for i,li in enumerate(items[:12]):
                txt=" ".join(li.get_text(" ",strip=True).split())
                print("  ",i,repr(txt[:180]),"children",[(c.name,len(c.find_all("li",recursive=False))) for c in li.find_all(["ul","ol"],recursive=False)])
          PY