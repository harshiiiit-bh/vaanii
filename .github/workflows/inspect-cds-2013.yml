name: Import CDS 2013 papers
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-cds-2013.yml"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Import and validate both papers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install --quiet beautifulsoup4 requests
          cat > /tmp/import_cds_2013.py <<'PY'
          import json, re, subprocess
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          SOURCES = {
            "I": "https://examvictor.com/cds-2013-english-question-paper-1/",
            "II": "https://examvictor.com/cds-2013-english-question-paper-2/",
          }
          KEYS = {
            "I": """A B A C A B C B B B
          C A A C C D A D A C
          C B C B C B B B D A
          C B A B C C D D B A
          D C D B B A B D B C
          B D D A B D B B B A
          B B B A A B B C A C
          C B A B B B C D A B
          B A D A A C D B B D
          B C D C D B C C B D
          D C C A D B A A D C
          B A D A C B A B B C""".split(),
            "II": """B C A C C A C B C C
          A B B C C B B B C C
          C D B C C B B B D B
          B C D A C D B A B A
          D B C C C C A B C A
          A B B B A A A B C B
          C B D C A C D B C A
          B A C B C B B D A A
          B D B D D A A B C A
          B D A A C C A C D B
          C D B B A B A D B D
          A C B D A A B A D B""".split(),
          }
          SECTIONS = {
            "I": [(1,15,"Spotting Errors"),(16,35,"Sentence Improvement"),(36,50,"Synonyms"),
                  (51,56,"Fill in the Blanks"),(57,65,"Reconstructing Passage"),(66,77,"Selecting Words"),
                  (78,89,"Antonyms"),(90,102,"Ordering of Words in a Sentence"),(103,120,"Reading Comprehension")],
            "II": [(1,19,"Spotting Errors"),(20,46,"Reading Comprehension"),(47,64,"Ordering of Sentences"),
                   (65,80,"Ordering of Words in a Sentence"),(81,100,"Synonyms"),(101,120,"Antonyms")],
          }
          CONTEXT = {"I": [(66,77),(103,120)], "II": [(20,46)]}
          def norm(s): return re.sub(r"\s+"," ",s).strip()
          def section(s,n):
            for lo,hi,name in SECTIONS[s]:
              if lo<=n<=hi:return name
            raise ValueError(f"Missing section {s}-{n}")
          def in_context(s,n): return any(lo<=n<=hi for lo,hi in CONTEXT[s])
          def direct_list_items(el): return el.find_all("li",recursive=False)
          def outer_lists(root):
            result=[]
            for el in root.find_all(["ol","ul"]):
              if any(a.name in ("ol","ul") for a in el.parents if a is not root):
                continue
              result.append(el)
            return result
          def choice_list(li):
            for x in li.find_all(["ul","ol"]):
              if len(direct_list_items(x))==4:return x
            return None
          def text_without_lists(li):
            clone=BeautifulSoup(str(li),"html.parser").find("li")
            for x in clone.find_all(["ul","ol"]): x.decompose()
            return norm(clone.get_text(" ",strip=True))
          def underlines(li):
            return [norm(x.get_text(" ",strip=True)) for x in li.find_all("u")
                    if norm(x.get_text(" ",strip=True)) and
                    "no error" not in norm(x.get_text(" ",strip=True)).lower()]
          def passage_for(li,root,session,n):
            if not in_context(session,n): return ""
            for prev in li.find_all_previous("p"):
              txt=norm(prev.get_text(" ",strip=True))
              if re.match(r"^Passage\s*[-–—:]?\s*(?:[IVX]+|\d+)?\b",txt,re.I):
                body=prev.find_next_sibling("p")
                if body:
                  val=norm(body.get_text(" ",strip=True))
                  if val and not val.lower().startswith("direction"):return val
                nxt=prev.find_next("p")
                if nxt:
                  val=norm(nxt.get_text(" ",strip=True))
                  if val and not re.match(r"^Passage\b",val,re.I) and not val.lower().startswith("direction"):return val
            if session=="I" and 66<=n<=77:
              for p in root.find_all("p"):
                if norm(p.get_text(" ",strip=True)).upper()=="SELECTING WORDS":
                  for nxt in p.find_all_next("p"):
                    val=norm(nxt.get_text(" ",strip=True))
                    if val and not val.lower().startswith(("direction","example")) and len(val)>100:
                      return val
            return ""
          def parse(session):
            res=requests.get(SOURCES[session],headers={"User-Agent":"Mozilla/5.0 VAANI-import"},timeout=45)
            res.raise_for_status()
            root=BeautifulSoup(res.text,"html.parser").select_one(".entry-content")
            if not root:raise RuntimeError(f"Missing article root for {session}")
            lists=outer_lists(root)
            records=[]
            next_n=1
            for ix,lst in enumerate(lists):
              lis=direct_list_items(lst)
              if not lis:continue
              is_first_spot_ul=(session=="II" and next_n==1 and lst.name=="ul" and
                                any(x.find("u") for x in lis))
              if lst.name=="ul" and not is_first_spot_ul:continue
              if lst.name=="ol":
                start=int(lst.get("start") or next_n)
              else:
                start=next_n
              if start>120:continue
              unresolved=[]
              staged=[]
              # CDS-II Q32 is one item formatted as a list of three statements plus a stem.
              if session=="II" and start==32 and len(lis)==4 and "consider the following statements" in norm(lis[0].get_text(" ",strip=True)).lower():
                prompt=norm(" ".join(norm(x.get_text(" ",strip=True)) for x in lis))
                following=lst.find_next("p")
                if following:
                  tail=norm(following.get_text(" ",strip=True))
                  if tail.lower().startswith("which of the statements"):
                    prompt=norm(prompt+" "+tail)
                next_ul=next((x for x in lists[ix+1:] if x.name=="ul" and len(direct_list_items(x))==4),None)
                next_ol=next((x for x in lists[ix+1:] if x.name=="ol"),None)
                if not next_ul or (next_ol and lists.index(next_ul)>lists.index(next_ol)):
                  raise RuntimeError("CDS-II Q32 options not found")
                opts=[norm(x.get_text(" ",strip=True)) for x in direct_list_items(next_ul)]
                staged.append({"y":2013,"s":session,"n":32,"sec":section(session,32),"q":prompt,"o":opts,
                               "ans":"ABCD".index(KEYS[session][31]),
                               **({"passage":passage_for(lis[0],root,session,32)} if passage_for(lis[0],root,session,32) else {})})
                records.extend(staged)
                next_n=max(next_n,33)
                continue
              for off,li in enumerate(lis):
                n=start+off
                if n>120:continue
                sec=section(session,n)
                q=text_without_lists(li)
                opts_el=choice_list(li)
                opts=[norm(x.get_text(" ",strip=True)) for x in direct_list_items(opts_el)] if opts_el else []
                # The public transcription omits option (d) for this item; use the uploaded paper scan.
                if session=="II" and n==120:
                  opts=["Rare","Frequent","Sharp","Coordinated"]
                if sec=="Spotting Errors":
                  segs=underlines(li)
                  if len(segs)>=3:
                    q=" | ".join(segs[:3])
                    opts=segs[:3]+["No error"]
                  else:
                    q=re.sub(r"\s*No error[.,]?\s*$","",q,flags=re.I).strip()
                    opts=["Part (a)","Part (b)","Part (c)","No error"]
                else:
                  if not opts: unresolved.append(len(staged))
                kw=""
                if sec in ("Synonyms","Antonyms"):
                  us=underlines(li)
                  kw=us[0] if us else ""
                  if not q and kw:q=kw
                passage=passage_for(li,root,session,n)
                if sec=="Selecting Words" and not q:
                  q=f"Choose the correct word for blank {n-65}."
                staged.append({"y":2013,"s":session,"n":n,"sec":sec,"q":q,"o":opts,
                               "ans":"ABCD".index(KEYS[session][n-1]) if n<=len(KEYS[session]) else -1,
                               **({"keyword":kw} if kw else {}),
                               **({"passage":passage} if passage else {})})
              if unresolved:
                next_ul=next((x for x in lists[ix+1:] if x.name=="ul" and len(direct_list_items(x))==4),None)
                next_ol_before=next((x for x in lists[ix+1:] if x.name=="ol"),None)
                if next_ul and (next_ol_before is None or lists.index(next_ul)<lists.index(next_ol_before)):
                  if len(unresolved)==1:
                    staged[unresolved[0]]["o"]=[norm(x.get_text(" ",strip=True)) for x in direct_list_items(next_ul)]
                  else:
                    raise RuntimeError(f"{session} OL start {start}: {len(unresolved)} questions need external options")
              records.extend(staged)
              next_n=max(next_n,start+len(lis))
            records.sort(key=lambda x:x["n"])
            if len(KEYS[session])!=120:raise RuntimeError(f"{session} key has {len(KEYS[session])} entries")
            if len(records)!=120:raise RuntimeError(f"{session}: found {len(records)} records")
            nums=[x["n"] for x in records]
            if nums!=list(range(1,121)):raise RuntimeError(f"{session}: numbering gaps/duplicates {nums}")
            for x in records:
              if not x["q"]: raise RuntimeError(f"{session}-{x['n']}: empty question")
              if len(x["o"])!=4: raise RuntimeError(f"{session}-{x['n']}: expected 4 options, got {x['o']}")
              if not 0<=x["ans"]<4:raise RuntimeError(f"{session}-{x['n']}: bad answer index")
              if x["sec"] in ("Reading Comprehension","Selecting Words") and not x.get("passage"):
                print(f"WARNING: {session}-{x['n']} has no passage field")
            print(f"{session}: 120 questions valid")
            for n in [1,16,36,51,57,66,78,90,103] if session=="I" else [1,20,25,47,65,81,101]:
              x=records[n-1]
              print(f"SAMPLE {session}-{n} [{x['sec']}] Q={x['q'][:160]!r} O={x['o']} passage={len(x.get('passage',''))}")
            return records
          allq={s:parse(s) for s in ("I","II")}
          for s,qs in allq.items():
            fn=Path(f"data/pyq/cds-2013-{s}.js")
            var=f"PYQ_CDS_2013_{s.replace('-','_')}"
            fn.write_text(f"var {var} = "+json.dumps(qs,ensure_ascii=False,indent=2)+";\n",encoding="utf-8")
          manifest=Path("data/pyq/manifest.js")
          m=manifest.read_text(encoding="utf-8")
          if '"cds-2013-I"' not in m:
            anchor='  "cds-2014-I","cds-2014-II","cds-2015-I",'
            if anchor not in m:raise RuntimeError("manifest anchor missing")
            m=m.replace(anchor,'  "cds-2013-I","cds-2013-II",\n'+anchor,1)
            manifest.write_text(m,encoding="utf-8")
          subprocess.run(["node","--check","data/pyq/cds-2013-I.js"],check=True)
          subprocess.run(["node","--check","data/pyq/cds-2013-II.js"],check=True)
          subprocess.run(["node","scripts/check-quality.mjs"],check=True)
          subprocess.run(["git","config","user.name","github-actions[bot]"],check=True)
          subprocess.run(["git","config","user.email","41898282+github-actions[bot]@users.noreply.github.com"],check=True)
          subprocess.run(["git","add","data/pyq/cds-2013-I.js","data/pyq/cds-2013-II.js","data/pyq/manifest.js"],check=True)
          subprocess.run(["git","commit","-m","Add CDS English papers from 2013"],check=True)
          subprocess.run(["git","push","origin","HEAD:main"],check=True)
          PY
          python /tmp/import_cds_2013.py