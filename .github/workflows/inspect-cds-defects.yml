name: Temporary CDS spotting-error source inspection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-cds-defects.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save --no-package-lock cheerio@1.0.0-rc.12
      - run: |
          node --input-type=module <<'NODE'
          import * as cheerio from 'cheerio';
          const targets=[
            ['2011-I','https://examvictor.com/cds-2011-english-question-paper-1/',[60,61]],
            ['2012-II','https://examvictor.com/cds-2012-english-question-paper-2/',[33]]
          ];
          for(const [id,url,ns] of targets){
            const r=await fetch(url,{headers:{'user-agent':'Mozilla/5.0'}});
            const $=cheerio.load(await r.text()),e=$('.entry-content').first(),top=e.children().toArray();
            console.log('===',id,'===');
            for(const n of ns){
              const ol=top.find(x=>x.tagName==='ol'&&Number(x.attribs.start||1)===n);
              if(!ol){console.log('Q',n,'not found');continue;}
              const i=top.indexOf(ol);
              console.log('Q',n,'LI', $.html($(ol).children('li').first()).slice(0,2500));
              for(let j=i+1;j<top.length&&j<i+5&&top[j].tagName!=='ol';j++)console.log('NEXT',n,j-i,top[j].tagName,$.html(top[j]).slice(0,1500));
            }
          }
          NODE