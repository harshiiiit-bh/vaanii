name: Temporary CDS defect source inspection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-cds-defects.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save --no-package-lock cheerio@1.0.0-rc.12
      - name: Inspect source blocks
        run: |
          node --input-type=module <<'NODE'
          import * as cheerio from 'cheerio';
          const targets=[
            ['2009-II','https://examvictor.com/cds-2009-english-question-paper-2/',[21,48]],
            ['2010-I','https://examvictor.com/cds-2010-english-question-paper-1/',[113]]
          ];
          for(const [id,url,ns] of targets){
            const r=await fetch(url,{headers:{'user-agent':'Mozilla/5.0'}});
            const $=cheerio.load(await r.text()),e=$('.entry-content').first();
            const top=e.children().toArray();
            console.log('===',id,'===');
            for(const n of ns){
              const list=top.find(x=>x.tagName==='ol'&&Number(x.attribs.start||1)===n);
              if(!list){console.log('Q',n,'not found');continue;}
              const i=top.indexOf(list);
              console.log('Q',n,'START HTML', $.html(list).slice(0,3000));
              for(let j=i+1;j<top.length&&j<i+12&&top[j].tagName!=='ol';j++){
                console.log('NEXT',n,j-i,top[j].tagName,JSON.stringify($(top[j]).text().trim().replace(/\s+/g,' ')), $.html(top[j]).slice(0,1800));
              }
            }
          }
          NODE