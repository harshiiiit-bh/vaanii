name: Security audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    # The Gitleaks GitHub Action queries PR metadata; use the local CLI below for PRs
    # so fork/Dependabot PRs work with read-only permissions.
    if: github.event_name != 'pull_request'
    name: Scan repository history for exposed secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect leaked secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
      - name: Scan checked-out files for exposed secrets
        shell: bash
        run: |
          set +e
          gitleaks dir --config .gitleaks.toml . --redact --report-format json --report-path /tmp/gitleaks-working-tree.json --exit-code 1
          scan_status=$?
          if [ ! -f /tmp/gitleaks-working-tree.json ]; then
            echo "Gitleaks did not produce a report; treating the scan as failed."
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/gitleaks-working-tree.json").read_text())
          for item in report:
              # Never print the matched text, secret, or other credential-bearing fields.
              print(
                  "Potential secret-pattern match (value withheld): "
                  f"rule={item.get('RuleID', 'unknown-rule')}; "
                  f"file={item.get('File', 'unknown-file')}; "
                  f"line={item.get('StartLine', '?')}; "
                  f"commit={item.get('Commit', '')}"
              )
          report_status = 1 if report else 0
          PY
          report_status=$?
          if [ "$scan_status" -ne 0 ] || [ "$report_status" -ne 0 ]; then
            exit 1
          fi

  secret-scan-pr:
    if: github.event_name == 'pull_request'
    name: Scan pull-request files for exposed secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned Gitleaks CLI
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            --output /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan checked-out files
        shell: bash
        run: |
          set +e
          gitleaks dir --config .gitleaks.toml . --redact --report-format json --report-path /tmp/gitleaks-report.json --exit-code 1
          scan_status=$?
          set -e
          if [ ! -f /tmp/gitleaks-report.json ]; then
            echo "Gitleaks did not produce a report; treating the scan as failed."
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/gitleaks-report.json").read_text())
          for item in report:
              # Do not print Secret, Match, or other credential-bearing fields.
              rule = item.get("RuleID", "unknown-rule")
              file = item.get("File", "unknown-file")
              line = item.get("StartLine", "?")
              commit = item.get("Commit", "")
              print(f"Potential secret finding (value withheld): rule={rule}; file={file}; line={line}; commit={commit}")
          if report:
              raise SystemExit(1)
          PY
          report_status=$?
          if [ "$scan_status" -ne 0 ] || [ "$report_status" -ne 0 ]; then
            exit 1
          fi

  codeql:
    name: Static application security analysis
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Publish CodeQL results
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
