name: VAANI Defence Notification Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: defence-notification-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Refresh defence notifications
        run: node scripts/update-defence-notifications.mjs
      - name: Summarize source health
        id: source-health
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('data/defence-notifications-status.json', 'utf8'));
          if (!Array.isArray(report.sources) || !Number.isInteger(report.sourcesOk) || !Number.isInteger(report.sourcesTotal)) {
            throw new Error('Notification source-health report is invalid.');
          }
          const safe = value => String(value ?? '').replace(/[|\r\n]/g, ' ');
          const summary = [
            '### Notification source health',
            '',
            `- Checked: ${safe(report.checkedAt)}`,
            `- Reachable: **${report.sourcesOk}/${report.sourcesTotal}**`,
            `- Retained live/archive records: **${report.liveItems}/${report.archiveItems}**`,
            `- Previous snapshot retained: **${report.snapshotRetained ? 'yes' : 'no'}**`,
            '',
            '| Official source | Result | Matches | Duration | Detail |',
            '|---|---:|---:|---:|---|'
          ];
          for (const source of report.sources) {
            summary.push(`| ${safe(source.source)} | ${source.ok ? 'Reachable' : 'Failed'} | ${Number(source.found || 0)} | ${Number(source.durationMs || 0)} ms | ${safe(source.error || '')} |`);
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join('\n') + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sources_ok=${report.sourcesOk}\nsources_total=${report.sourcesTotal}\n`);
          if (report.sourcesOk < report.sourcesTotal) console.warn(`Partial notification source coverage: ${report.sourcesOk}/${report.sourcesTotal}.`);
          NODE

      - name: Check Cloudflare notification API health
        if: steps.source-health.outputs.sources_ok != '0'
        env:
          VAANI_NOTIFICATIONS_API: ${{ secrets.VAANI_NOTIFICATIONS_API }}
        run: |
          if [ -z "$VAANI_NOTIFICATIONS_API" ]; then
            echo "::error::Missing VAANI_NOTIFICATIONS_API repository secret."
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { fetchWithRetry } from './scripts/notification-sync-utils.mjs';
          const base = process.env.VAANI_NOTIFICATIONS_API.replace(/\/$/, '');
          const response = await fetchWithRetry(base + '/health', {
            headers: { accept: 'application/json' }, attempts: 3, timeoutMs: 10000, baseDelayMs: 300
          });
          const health = await response.json();
          if (health?.ok !== true) throw new Error('Cloudflare health endpoint returned an invalid status.');
          console.log('Cloudflare notification API health check passed.');
          NODE

      - name: Sync live feed to Cloudflare D1
        if: steps.source-health.outputs.sources_ok != '0'
        env:
          VAANI_NOTIFICATIONS_API: ${{ secrets.VAANI_NOTIFICATIONS_API }}
          VAANI_NOTIFICATIONS_SYNC_SECRET: ${{ secrets.VAANI_NOTIFICATIONS_SYNC_SECRET }}
        run: |
          if [ -z "$VAANI_NOTIFICATIONS_API" ] || [ -z "$VAANI_NOTIFICATIONS_SYNC_SECRET" ]; then
            echo "::error::Missing VAANI_NOTIFICATIONS_API or VAANI_NOTIFICATIONS_SYNC_SECRET repository secret."
            exit 1
          fi
          node --input-type=module <<'NODE'
          import * as fs from 'node:fs';
          import { fetchWithRetry } from './scripts/notification-sync-utils.mjs';
          const feed = JSON.parse(fs.readFileSync('data/defence-notifications.json','utf8'));
          const archive = JSON.parse(fs.readFileSync('data/defence-notifications-archive.json','utf8'));
          const archiveIds = new Set((archive.items || []).map(x => x.id));
          const records = [...(feed.items || []), ...(archive.items || [])];
          const pruneIds = [...new Set(Array.isArray(feed.pruneIds) ? feed.pruneIds : [])];
          const chunkSize = 20;
          const chunks = Math.ceil(records.length / chunkSize);
          const pruneChunks = Math.ceil(pruneIds.length / chunkSize);
          let synced = 0;
          let archived = 0;
          let deleted = 0;
          const endpoint = process.env.VAANI_NOTIFICATIONS_API.replace(/\/$/, '') + '/api/notifications/sync';
          const headers = {
            'content-type': 'application/json',
            'authorization': 'Bearer ' + process.env.VAANI_NOTIFICATIONS_SYNC_SECRET
          };

          async function request(body, label) {
            const response = await fetchWithRetry(endpoint, {
              method: 'POST', headers, body: JSON.stringify(body),
              attempts: 3, timeoutMs: 60000, baseDelayMs: 350, maxDelayMs: 3000
            });
            const payload = await response.json();
            if (!payload || payload.ok !== true) throw new Error('Cloudflare sync returned an invalid response for ' + label);
            return payload;
          }

          (async () => {
            for (let offset = 0; offset < records.length; offset += chunkSize) {
              const chunk = records.slice(offset, offset + chunkSize);
              const ids = chunk.filter(x => archiveIds.has(x.id)).map(x => x.id);
              const result = await request({ items: chunk, archiveIds: ids }, 'record chunk ' + (Math.floor(offset / chunkSize) + 1) + '/' + chunks);
              synced += Number(result.synced || 0);
              archived += Number(result.archived || 0);
              console.log('Synced chunk ' + (Math.floor(offset / chunkSize) + 1) + '/' + chunks + ': ' + (result.synced || 0) + ' records, ' + (result.archived || 0) + ' archive flags');
            }
            for (let offset = 0; offset < pruneIds.length; offset += chunkSize) {
              const chunk = pruneIds.slice(offset, offset + chunkSize);
              const result = await request({ pruneIds: chunk }, 'cleanup chunk ' + (Math.floor(offset / chunkSize) + 1) + '/' + pruneChunks);
              deleted += Number(result.deleted || 0);
              console.log('Removed rejected entries ' + (Math.floor(offset / chunkSize) + 1) + '/' + pruneChunks + ': ' + (result.deleted || 0));
            }
            if (pruneIds.length) {
              feed.pruneIds = [];
              fs.writeFileSync('data/defence-notifications.json', JSON.stringify(feed, null, 2) + '\n');
            }
            console.log(JSON.stringify({ ok: true, chunks, synced, archived, pruneChunks, deleted }));
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Commit changed JSON snapshot
        run: |
          git config user.name "vaani-notification-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/defence-notifications.json data/defence-notifications-archive.json data/defence-notifications-status.json
          if git diff --cached --quiet; then
            echo "No notification snapshot changes detected."
            exit 0
          fi
          git commit -m "chore: refresh defence notifications"
          git push
