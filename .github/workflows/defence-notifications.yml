name: VAANI Defence Notification Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: defence-notification-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh defence notifications
        run: node scripts/update-defence-notifications.mjs

      - name: Sync live feed to Cloudflare D1
        env:
          VAANI_NOTIFICATIONS_API: ${{ secrets.VAANI_NOTIFICATIONS_API }}
          VAANI_NOTIFICATIONS_SYNC_SECRET: ${{ secrets.VAANI_NOTIFICATIONS_SYNC_SECRET }}
        run: |
          if [ -z "$VAANI_NOTIFICATIONS_API" ] || [ -z "$VAANI_NOTIFICATIONS_SYNC_SECRET" ]; then
            echo "::error::Missing VAANI_NOTIFICATIONS_API or VAANI_NOTIFICATIONS_SYNC_SECRET repository secret."
            exit 1
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const feed = JSON.parse(fs.readFileSync('data/defence-notifications.json','utf8'));
          const archive = JSON.parse(fs.readFileSync('data/defence-notifications-archive.json','utf8'));
          const payload = JSON.stringify({
            items: [...(feed.items || []), ...(archive.items || [])],
            archiveIds: (archive.items || []).map(x => x.id)
          });
          fetch(process.env.VAANI_NOTIFICATIONS_API.replace(/\/$/, '') + '/api/notifications/sync', {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              'authorization': 'Bearer ' + process.env.VAANI_NOTIFICATIONS_SYNC_SECRET
            },
            body: payload
          }).then(async r => {
            const text = await r.text();
            if (!r.ok) throw new Error('Cloudflare sync failed: ' + r.status + ' ' + text);
            console.log(text);
          }).catch(e => { console.error(e); process.exit(1); });
          NODE

      - name: Commit changed JSON snapshot
        run: |
          git config user.name "vaani-notification-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/defence-notifications.json data/defence-notifications-archive.json
          if git diff --cached --quiet; then
            echo "No notification snapshot changes detected."
            exit 0
          fi
          git commit -m "chore: refresh defence notifications"
          git push
