name: Temporary CDS data structure inspection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-early-cds.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save --no-package-lock cheerio@1.0.0-rc.12
      - name: Dump representative question nodes
        run: |
          node --input-type=module <<'NODE'
          import * as cheerio from 'cheerio';
          const url='https://examvictor.com/cds-2009-english-question-paper-1/';
          const r=await fetch(url,{headers:{'user-agent':'Mozilla/5.0'}});
          const $=cheerio.load(await r.text());const e=$('.entry-content').first();
          for(const st of ['1','12','15','17','18','21','23','24','28','31','35','38','44','59','68','95','101','105','109','116','119']){
            const ol=e.find('ol').filter((_,el)=>el.attribs.start===st).first();
            console.log('===START '+st+'===');
            if(!ol.length){console.log('NOT FOUND');continue;}
            const li=ol.children('li').first();
            console.log('LI', $.html(li[0])?.slice(0,2500)?.replace(/\s+/g,' '));
            console.log('NEAR',ol.nextAll().slice(0,8).toArray().map(x=>x.tagName+':'+$(x).text().trim().slice(0,130).replace(/\s+/g,' ')).join(' || '));
          }
          NODE