name: Temporary CDS final passage numbering inspection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-early-cds.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save --no-package-lock cheerio@1.0.0-rc.12
      - run: |
          node --input-type=module <<'NODE'
          import * as cheerio from 'cheerio';
          const url='https://examvictor.com/cds-2011-english-question-paper-2/';
          const r=await fetch(url,{headers:{'user-agent':'Mozilla/5.0'}});
          const $=cheerio.load(await r.text()),e=$('.entry-content').first(),top=e.children().toArray();
          for(let i=0;i<top.length;i++){
            const node=top[i];
            if(node.tagName!=='ol')continue;
            const n=Number.parseInt(node.attribs.start||'1',10);
            if(n<90||n>120)continue;
            const li=$(node).children('li').toArray();
            console.log('OL',n,'len',li.length,'items',JSON.stringify(li.map(x=>$(x).text().trim().replace(/\s+/g,' ').slice(0,220))));
          }
          NODE