name: Temporary early CDS bank structure inspection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-early-cds.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save --no-package-lock cheerio@1.0.0-rc.12
      - name: Inspect question and option blocks
        run: |
          node --input-type=module <<'NODE'
          import * as cheerio from 'cheerio';
          const targets = [
            ['2009-I','https://examvictor.com/cds-2009-english-question-paper-1/',['44','59']],
            ['2012-II','https://examvictor.com/cds-2012-english-question-paper-2/',['71','92']],
            ['2009-II','https://examvictor.com/cds-2009-english-question-paper-2/',['21','40']]
          ];
          for(const [id,url,starts] of targets){
            const r=await fetch(url,{headers:{'user-agent':'Mozilla/5.0'}});
            const $=cheerio.load(await r.text());const e=$('.entry-content').first();
            console.log('PAPER',id);
            for(const st of starts){
              const ol=e.find('ol').filter((_,el)=>el.attribs.start===st).first();
              if(!ol.length){console.log('START',st,'not found');continue;}
              console.log('OL',st,$.html(ol[0]));
              let s=ol.next();
              for(let i=0;i<4&&s.length;i++,s=s.next())console.log('SIB',st,i,s[0]?.tagName,$.html(s[0])?.slice(0,900));
            }
          }
          NODE