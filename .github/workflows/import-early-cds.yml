name: Temporary early CDS bank structure inspection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-early-cds.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save --no-package-lock cheerio@1.0.0-rc.12
      - name: Inspect numbered list structures
        run: |
          node --input-type=module <<'NODE'
          import * as cheerio from 'cheerio';
          const urls = [
            'https://examvictor.com/cds-2009-english-question-paper-1/',
            'https://examvictor.com/cds-2009-english-question-paper-2/',
            'https://examvictor.com/cds-2010-english-question-paper-1/',
            'https://examvictor.com/cds-2011-english-question-paper-1/',
            'https://examvictor.com/cds-2011-english-question-paper-2/',
            'https://examvictor.com/cds-2012-english-question-paper-2/'
          ];
          for (const url of urls) {
            const res = await fetch(url,{headers:{'user-agent':'Mozilla/5.0'}});
            const $=cheerio.load(await res.text());
            const e=$('.entry-content').first();
            const ols=e.find('ol').toArray();
            const tops=ols.filter(x=>!$(x).parents('ol').length);
            const paras=e.find('p').toArray().map(x=>$(x).text().trim()).filter(x=>/^\d{1,3}[.)]\s/.test(x));
            console.log('PAPER',url,'ol',ols.length,'topol',tops.length,'li',e.find('li').length,'ul',e.find('ul').length,'numberedP',paras.length);
            console.log('TOPOL',tops.map(x=>{const lis=$(x).children('li').toArray();return '['+(x.attribs.start||'1')+':'+lis.length+':'+lis.slice(0,2).map(y=>$(y).text().trim().slice(0,50).replace(/\s+/g,' ')).join('|')+':'+lis.slice(-1).map(y=>$(y).text().trim().slice(0,35).replace(/\s+/g,' ')).join('')+']'}).join(' '));
            console.log('NUMBEREDP',paras.slice(0,12).join(' || '));
            const special=e.find('li').toArray().find(x=>$(x).text().includes('Having visited the Taj Mahal')||$(x).text().includes('I sat at the table and ate'));
            if(special)console.log('SPECIAL',$(special).parents().toArray().slice(0,5).map(x=>x.tagName+':'+(x.attribs?.start||'')+':'+$(x).text().trim().slice(0,100).replace(/\s+/g,' ')).join(' <- '));
          }
          NODE