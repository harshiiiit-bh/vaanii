name: Temporary CDS statement question inspection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-early-cds.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save --no-package-lock cheerio@1.0.0-rc.12
      - run: |
          node --input-type=module <<'NODE'
          import * as cheerio from 'cheerio';
          const r=await fetch('https://examvictor.com/cds-2011-english-question-paper-2/',{headers:{'user-agent':'Mozilla/5.0'}});
          const $=cheerio.load(await r.text()),e=$('.entry-content').first();
          for(const el of e.find('ol').toArray().filter(x=>!$(x).parents('ol').length&&x.attribs.start==='102')){
            console.log('OL102', $.html(el));
          }
          NODE