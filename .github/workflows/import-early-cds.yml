name: Temporary early CDS question block inspection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-early-cds.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save --no-package-lock cheerio@1.0.0-rc.12
      - name: Inspect question boundaries
        run: |
          node --input-type=module <<'NODE'
          import * as cheerio from 'cheerio';
          const targets=[
            ['09I','https://examvictor.com/cds-2009-english-question-paper-1/',['44','59','95']],
            ['10I','https://examvictor.com/cds-2010-english-question-paper-1/',['41','74','101']],
            ['12II','https://examvictor.com/cds-2012-english-question-paper-2/',['33','71','92']]
          ];
          for(const [id,url,starts] of targets){
            const r=await fetch(url,{headers:{'user-agent':'Mozilla/5.0'}});
            const $=cheerio.load(await r.text());const e=$('.entry-content').first();
            console.log('PAPER',id);
            for(const st of starts){
              const ol=e.find('ol').filter((_,el)=>el.attribs.start===st).first();
              if(!ol.length){console.log('START',st,'not found');continue;}
              console.log('OLRAW',st,$.html(ol[0])?.slice(0,1200));
              let n=ol.next(),i=0;
              while(n.length&&n[0].tagName!=='ol'&&i<14){
                const tx=$(n).text().trim().replace(/\s+/g,' ');
                console.log('NEXT',st,i,n[0].tagName,tx.slice(0,180));
                n=n.next();i++;
              }
            }
          }
          NODE