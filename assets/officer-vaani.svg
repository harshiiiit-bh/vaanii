<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" role="img" aria-labelledby="title desc">
  <title id="title">Officer VAANI — Your Training Officer</title>
  <desc id="desc">Athletic young Indian defence training officer in ceremonial olive uniform with burnished gold epaulettes, medal ribbons, and peaked beret.</desc>
  <defs>
    <!-- Ambient Command Halo -->
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="54%">
      <stop offset="0%" stop-color="#c9a24b" stop-opacity="0.28"/>
      <stop offset="65%" stop-color="#18303c" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0b1520" stop-opacity="0"/>
    </radialGradient>
    <!-- Ceremonial Olive Service Tunic (3D Shaded) -->
    <linearGradient id="tunicMain" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#4e6343"/>
      <stop offset="45%" stop-color="#384b31"/>
      <stop offset="100%" stop-color="#22301e"/>
    </linearGradient>
    <linearGradient id="tunicLapel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5d7450"/>
      <stop offset="100%" stop-color="#2d3e27"/>
    </linearGradient>
    <linearGradient id="shirtKhaki" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2ead7"/>
      <stop offset="100%" stop-color="#d5c6a5"/>
    </linearGradient>
    <linearGradient id="tieOlive" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b3a24"/>
      <stop offset="100%" stop-color="#172113"/>
    </linearGradient>
    <!-- Burnished Gold Insignia & Buttons -->
    <linearGradient id="brassGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9e498"/>
      <stop offset="50%" stop-color="#d4a849"/>
      <stop offset="100%" stop-color="#8f681e"/>
    </linearGradient>
    <!-- Sam Browne Leather Belt -->
    <linearGradient id="leatherStrap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6e3b23"/>
      <stop offset="50%" stop-color="#4d2614"/>
      <stop offset="100%" stop-color="#2e150a"/>
    </linearGradient>
    <!-- Natural Warm Indian Skin Tone (3D Lit) -->
    <linearGradient id="skinFace" x1="0.2" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0%" stop-color="#e5ae86"/>
      <stop offset="55%" stop-color="#cf9167"/>
      <stop offset="100%" stop-color="#a86b44"/>
    </linearGradient>
    <linearGradient id="skinNeck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b87851"/>
      <stop offset="100%" stop-color="#935936"/>
    </linearGradient>
    <!-- Beret & Hair -->
    <linearGradient id="beretGreen" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#3f5538"/>
      <stop offset="60%" stop-color="#293924"/>
      <stop offset="100%" stop-color="#182315"/>
    </linearGradient>
    <linearGradient id="hairDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b2623"/>
      <stop offset="100%" stop-color="#12100e"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#071118" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Subtle Tactical Halo & Ground Shadow -->
  <circle cx="160" cy="158" r="134" fill="url(#bgGlow)"/>
  <ellipse cx="160" cy="346" rx="108" ry="9" fill="#09131a" opacity="0.28"/>

  <g filter="url(#softShadow)">
    <!-- Broad Athletic Torso & Ceremonial Olive Tunic -->
    <path d="M34 348 C40 268, 72 226, 118 214 L202 214 C248 226, 280 268, 286 348 Z" fill="url(#tunicMain)" stroke="#1e2b1a" stroke-width="2.5"/>

    <!-- Sculpted Shoulder Deltoids & Sleeve Seams -->
    <path d="M34 348 C38 286, 58 242, 92 224 L104 348 Z" fill="#2e3f28" opacity="0.55"/>
    <path d="M286 348 C282 286, 262 242, 228 224 L216 348 Z" fill="#23311e" opacity="0.65"/>

    <!-- Ceremonial Epaulettes (Left & Right Shoulders) -->
    <path d="M62 232 L118 213 L122 227 L68 245 Z" fill="url(#tunicLapel)" stroke="url(#brassGold)" stroke-width="1.8"/>
    <path d="M258 232 L202 213 L198 227 L252 245 Z" fill="url(#tunicLapel)" stroke="url(#brassGold)" stroke-width="1.8"/>
    <!-- Gold Officer Stars on Epaulettes -->
    <circle cx="84" cy="232" r="4.2" fill="url(#brassGold)"/>
    <circle cx="100" cy="226" r="4.2" fill="url(#brassGold)"/>
    <circle cx="236" cy="232" r="4.2" fill="url(#brassGold)"/>
    <circle cx="220" cy="226" r="4.2" fill="url(#brassGold)"/>

    <!-- Strong Muscular Neck -->
    <path d="M132 178 L188 178 L194 224 L160 242 L126 224 Z" fill="url(#skinNeck)"/>
    <path d="M140 192 Q160 206 180 192" fill="none" stroke="#874f2f" stroke-width="2" opacity="0.5"/>

    <!-- Crisp Khaki Shirt Collar & Olive Ceremonial Tie -->
    <path d="M126 212 L160 256 L194 212 L184 202 L160 228 L136 202 Z" fill="url(#shirtKhaki)" stroke="#bfb08e" stroke-width="1.2"/>
    <path d="M153 224 L167 224 L170 278 L160 292 L150 278 Z" fill="url(#tieOlive)"/>
    <path d="M151 220 L169 220 L166 232 L154 232 Z" fill="#23301d" stroke="url(#brassGold)" stroke-width="0.8"/>

    <!-- Tailored Tunic Lapels & Crimson/Gold Gorget Patches -->
    <path d="M116 212 L160 288 L134 296 L102 242 Z" fill="url(#tunicLapel)" stroke="#23311e" stroke-width="1.5"/>
    <path d="M204 212 L160 288 L186 296 L218 242 Z" fill="url(#tunicLapel)" stroke="#23311e" stroke-width="1.5"/>
    <!-- Collar Gorget Patches -->
    <polygon points="114,234 128,228 135,248 121,253" fill="#8f2424" stroke="url(#brassGold)" stroke-width="1"/>
    <polygon points="206,234 192,228 185,248 199,253" fill="#8f2424" stroke="url(#brassGold)" stroke-width="1"/>

    <!-- Sam Browne Leather Cross-Strap & Brass Buckle -->
    <path d="M96 222 L208 348 L226 348 L112 216 Z" fill="url(#leatherStrap)" stroke="#281107" stroke-width="1.2"/>
    <rect x="147" y="274" width="22" height="15" rx="2.5" transform="rotate(42 158 281)" fill="none" stroke="url(#brassGold)" stroke-width="3"/>

    <!-- Chest Pockets, Medal Ribbons & Nameplate -->
    <rect x="76" y="284" width="52" height="44" rx="4" fill="#32442b" stroke="#202d1b" stroke-width="1.5"/>
    <path d="M76 284 L102 296 L128 284" fill="#3f5436" stroke="#202d1b" stroke-width="1.5"/>
    <circle cx="102" cy="291" r="3.2" fill="url(#brassGold)"/>

    <rect x="192" y="284" width="52" height="44" rx="4" fill="#32442b" stroke="#202d1b" stroke-width="1.5"/>
    <path d="M192 284 L218 296 L244 284" fill="#3f5436" stroke="#202d1b" stroke-width="1.5"/>
    <circle cx="218" cy="291" r="3.2" fill="url(#brassGold)"/>

    <!-- Service Medal Ribbon Bar (Left Chest) -->
    <g transform="translate(194, 266)">
      <rect x="0" y="0" width="16" height="7" rx="1" fill="#b83227"/>
      <rect x="5" y="0" width="6" height="7" fill="#e5c158"/>
      <rect x="17" y="0" width="16" height="7" rx="1" fill="#1d4e89"/>
      <rect x="22" y="0" width="6" height="7" fill="#f0f4f8"/>
      <rect x="34" y="0" width="16" height="7" rx="1" fill="#2e6f40"/>
      <rect x="39" y="0" width="6" height="7" fill="#d99b26"/>
      <rect x="0" y="0" width="50" height="7" rx="1" fill="none" stroke="url(#brassGold)" stroke-width="1"/>
    </g>

    <!-- Black & Gold Officer Nameplate (Right Chest) -->
    <rect x="76" y="267" width="52" height="10" rx="2" fill="#101820" stroke="url(#brassGold)" stroke-width="1.2"/>
    <text x="102" y="274.5" text-anchor="middle" fill="#f6df96" font-family="monospace" font-size="6.2" font-weight="700" letter-spacing="0.8">VAANI</text>

    <!-- Center Brass Buttons -->
    <line x1="160" y1="288" x2="160" y2="348" stroke="#1e2b1a" stroke-width="2.2"/>
    <circle cx="160" cy="304" r="4.2" fill="url(#brassGold)"/>
    <circle cx="160" cy="328" r="4.2" fill="url(#brassGold)"/>

    <!-- Proportional Ears -->
    <path d="M107 118 C98 116, 95 130, 99 142 C102 150, 108 153, 113 149 Z" fill="url(#skinFace)" stroke="#9b5f3b" stroke-width="1.8"/>
    <path d="M213 118 C222 116, 225 130, 221 142 C218 150, 212 153, 207 149 Z" fill="url(#skinFace)" stroke="#9b5f3b" stroke-width="1.8"/>

    <!-- Sculpted Athletic Jawline & Head Structure -->
    <path d="M110 88 C110 56, 130 42, 160 42 C190 42, 210 56, 210 88 L210 132 C210 158, 193 182, 160 190 C127 182, 110 158, 110 132 Z" fill="url(#skinFace)" stroke="#935836" stroke-width="2"/>

    <!-- Subtle Cheekbone & Jaw Shading for 3D Depth -->
    <path d="M116 140 Q132 174 160 183 Q188 174 204 140" fill="none" stroke="#9e623e" stroke-width="2.5" opacity="0.35"/>

    <!-- Neat Military Side-Part Fade Haircut -->
    <path d="M108 106 C106 78, 116 54, 146 48 C174 44, 206 56, 212 86 C213 94, 212 102, 210 108 C207 92, 199 82, 184 78 C162 74, 136 82, 120 92 C114 96, 111 101, 108 106 Z" fill="url(#hairDark)"/>

    <!-- Strong Expressive Eyebrows -->
    <path d="M124 111 Q136 105 149 109" fill="none" stroke="#221d1a" stroke-width="4.2" stroke-linecap="round"/>
    <path d="M171 109 Q184 105 196 111" fill="none" stroke="#221d1a" stroke-width="4.2" stroke-linecap="round"/>

    <!-- Sharp Confident Eyes with Catchlights -->
    <ellipse cx="137" cy="122" rx="8.5" ry="5.2" fill="#ffffff"/>
    <ellipse cx="183" cy="122" rx="8.5" ry="5.2" fill="#ffffff"/>
    <circle cx="137" cy="122" r="4.3" fill="#2a1e17"/>
    <circle cx="183" cy="122" r="4.3" fill="#2a1e17"/>
    <circle cx="137" cy="122" r="2.1" fill="#0d0907"/>
    <circle cx="183" cy="122" r="2.1" fill="#0d0907"/>
    <circle cx="139" cy="120.2" r="1.4" fill="#ffffff"/>
    <circle cx="185" cy="120.2" r="1.4" fill="#ffffff"/>
    <path d="M127 120 Q137 115 147 121" fill="none" stroke="#2a1e17" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M173 121 Q183 115 193 120" fill="none" stroke="#2a1e17" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Defined Nose Bridge -->
    <path d="M160 116 L157 142 Q160 146 166 143" fill="none" stroke="#8f5331" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Confident, Approachable Officer Smile & Groomed Mustache Hint -->
    <path d="M144 158 Q160 167 176 158" fill="none" stroke="#7d4324" stroke-width="3" stroke-linecap="round"/>
    <path d="M149 160 Q160 165 171 160" fill="#ffffff" opacity="0.75"/>
    <path d="M153 171 Q160 174 167 171" fill="none" stroke="#995b38" stroke-width="1.8" stroke-linecap="round" opacity="0.65"/>

    <!-- Ceremonial Defence Beret with Leather Rim & Gold Cap Badge -->
    <path d="M98 82 C96 44, 134 22, 178 26 C214 29, 234 48, 228 76 C206 70, 174 68, 138 74 C120 77, 108 80, 98 82 Z" fill="url(#beretGreen)" stroke="#172214" stroke-width="2.2"/>
    <!-- Beret Band -->
    <path d="M104 78 Q160 66 216 78 L214 87 Q160 76 106 87 Z" fill="#141a14" stroke="url(#brassGold)" stroke-width="1"/>
    <!-- Ceremonial Gold Emblem Badge on Beret -->
    <g transform="translate(136, 46)">
      <circle cx="0" cy="12" r="11" fill="#8f2424" stroke="url(#brassGold)" stroke-width="2"/>
      <polygon points="0,4 2.5,9.5 8.5,10 4,14 5.2,20 0,16.8 -5.2,20 -4,14 -8.5,10 -2.5,9.5" fill="url(#brassGold)"/>
    </g>
  </g>
</svg>